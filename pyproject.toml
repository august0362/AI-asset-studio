[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-asset-studio"
version = "0.3.0"
description = "AI Asset Studio: FastAPI backend, model contracts/adapters and the Kaggle connector (M3: mock and Kaggle compute)."
requires-python = ">=3.11"
# Pinned when the package was created (docs/ARCHITECTURE.md §3).
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",  # already required by pydantic-settings; imported directly for AAS_PROFILE_* (M3)
    "python-multipart==0.0.33",
    "pillow==13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.3",
]

[project.scripts]
aas-backend = "aas_backend.__main__:main"

[tool.setuptools.packages.find]
where = [".", "interface/backend"]
include = ["models*", "kaggle_connector*", "aas_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not kaggle'"
markers = ["kaggle: live Kaggle tests (opt-in, M3+)"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["interface/frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "S603",   # subprocess without shell is intended (mock runner)
    "RUF001", # the contracts use typographic characters (→, …) on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["models", "kaggle_connector", "aas_backend", "tests"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # the formatter wraps code at 110; docstrings and comments may reach 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
