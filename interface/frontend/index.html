<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let mode = "system",
          family = "coffee",
          locale;
        try {
          const saved = JSON.parse(localStorage.getItem("aas.theme") || "null");
          if (
            saved &&
            ["light", "dark", "system"].includes(saved.mode) &&
            ["coffee", "green"].includes(saved.family)
          ) {
            mode = saved.mode;
            family = saved.family;
          }
        } catch {}
        const dark =
          mode === "dark" ||
          (mode === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme =
          family === "coffee"
            ? dark
              ? "caffe"
              : "latte"
            : dark
              ? "matcha"
              : "mint";
        try {
          locale = localStorage.getItem("aas.locale");
        } catch {}
        if (locale !== "vi" && locale !== "en")
          locale = navigator.languages.some((language) => /^vi/i.test(language))
            ? "vi"
            : "en";
        document.documentElement.lang = locale;
      })();
    </script>
    <link
      rel="preload"
      href="/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="description"
      content="AI Asset Studio"
    />
    <title>AI Asset Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
